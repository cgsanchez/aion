[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aion"
version = "0.1.0"
description = "Real-time TDDFT prototypes for gauge-covariant finite-basis dynamics"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
]

[project.optional-dependencies]
pyscf = [
  "pyscf",
]
gpu = [
  "cupy-cuda12x",
  "gpu4pyscf-cuda12x",
]
plot = [
  "matplotlib",
]
test = [
  "pytest",
]
dev = [
  "matplotlib",
  "pyscf",
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
